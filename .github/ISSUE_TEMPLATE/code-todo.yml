name: "Code TODO / Technical Debt"
description: "Track technical debt or implementation tasks found in code comments (TODO/FIXME/FEAT)"
title: "[TODO] "
labels: ["type:tech-debt", "status:needs-scoping", "source:code-comment"]
body:
  - type: markdown
    attributes:
      value: |
        ## Code Comment Issue
        This issue tracks a TODO, FIXME, or FEAT comment found in the codebase.

        > **Note:** Issues with the `source:code-comment` label are managed by the TODO-to-Issues automation.

  - type: dropdown
    id: source-type
    attributes:
      label: Source Type
      description: Type of code comment that generated this issue
      options:
        - TODO
        - FIXME
        - FEAT
    validations:
      required: true

  - type: input
    id: source-location
    attributes:
      label: Source Location
      description: File path and line number (e.g., src/lib/model/OpenBISModel.ts:45)
      placeholder: "src/path/to/file.ts:123"
    validations:
      required: true

  - type: textarea
    id: current-code
    attributes:
      label: Current Code
      description: The code context around the TODO/FIXME/FEAT comment
      render: typescript
      placeholder: |
        // TODO: Implement this feature
        function myFunction() {
          // ...
        }
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done? Provide context and acceptance criteria.
      placeholder: |
        **What:** Describe the work to be done

        **Why:** Explain the motivation or problem being solved

        **Acceptance Criteria:**
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true

  - type: dropdown
    id: phase
    attributes:
      label: Phase Alignment
      description: When should this be addressed?
      options:
        - "Phase 0 (Visual-First)"
        - "Phase 1 (API Integration)"
        - "Phase 2 (Advanced Features)"
        - "Future / Nice-to-have"
    validations:
      required: true

  - type: checkboxes
    id: impact
    attributes:
      label: Impact
      description: Select all that apply
      options:
        - label: Blocks other features
        - label: Performance concern
        - label: Code quality / maintainability
        - label: Security concern
        - label: Low priority / cosmetic

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How urgent is this issue?
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: false

  - type: input
    id: parent-epic
    attributes:
      label: Parent Epic
      description: Link to parent epic if applicable (e.g., #42)
      placeholder: "#42"
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any additional information, screenshots, or references
    validations:
      required: false

  - type: checkboxes
    id: auto-generated
    attributes:
      label: Automation Metadata
      description: For tracking purposes (do not modify)
      options:
        - label: This issue was auto-generated by the TODO-to-Issues agent
