name: CI

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "nextapp/**"
      - ".github/workflows/ci.yml"

jobs:
  ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./nextapp

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./nextapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check file naming conventions
        run: npm run check-naming

      - name: Run linter
        run: npm run lint

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Build Next.js
        run: npm run build

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: ./nextapp/.next
          retention-days: 1
